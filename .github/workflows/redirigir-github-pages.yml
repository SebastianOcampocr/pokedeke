# La copia vieja en GitHub Pages ya no es una tienda: solo manda a pokedeke.store,
# para que los enlaces que se compartieron antes sigan sirviendo. Se corre a mano,
# una sola vez, o si cambia infra/github-pages.
name: Redirigir GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redirigir:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: infra/github-pages
      - id: despliegue
        uses: actions/deploy-pages@v5
