# Publica la demo en GitHub Pages con cada cambio en main y cada vez que el
# catálogo de la hoja de Google cambia.
name: Publicar demo

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publicar: ${{ steps.cambios.outputs.publicar }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Traer el catálogo de la hoja
        run: node scripts/traer-catalogo.mjs
        env:
          PEDIDOS_URL: ${{ vars.PEDIDOS_URL }}
      - name: Guardar el catálogo si cambió
        id: cambios
        run: |
          if git diff --quiet datos/catalogo.json; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "publicar=no" >> "$GITHUB_OUTPUT"
            else
              echo "publicar=si" >> "$GITHUB_OUTPUT"
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos/catalogo.json
            git commit -m "Actualizar catálogo desde la hoja"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "publicar=si" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: revisar
    if: needs.revisar.outputs.publicar == 'si'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_RUTA_BASE: /${{ github.event.repository.name }}
          NEXT_PUBLIC_PEDIDOS_URL: ${{ vars.PEDIDOS_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: despliegue
        uses: actions/deploy-pages@v5
