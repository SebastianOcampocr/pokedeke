# Publica la demo en GitHub Pages con cada cambio en main y cada vez que el
# catálogo de la hoja de Google cambia.
name: Publicar demo

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publicar: ${{ steps.cambios.outputs.publicar }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Traer el catálogo de la hoja
        run: node scripts/traer-catalogo.mjs
        env:
          PEDIDOS_URL: ${{ vars.PEDIDOS_URL }}
      - name: Guardar el catálogo si cambió
        id: cambios
        run: |
          if git diff --quiet datos/catalogo.json; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "publicar=no" >> "$GITHUB_OUTPUT"
            else
              echo "publicar=si" >> "$GITHUB_OUTPUT"
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos/catalogo.json
            git commit -m "Actualizar catálogo desde la hoja"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "publicar=si" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: revisar
    if: needs.revisar.outputs.publicar == 'si' && vars.AWS_BUCKET == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_RUTA_BASE: /${{ github.event.repository.name }}
          # El catálogo se lee siempre; los pedidos reales solo con la tienda abierta.
          NEXT_PUBLIC_PEDIDOS_URL: ${{ vars.TIENDA_ABIERTA == 'si' && vars.PEDIDOS_URL || '' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: despliegue
        uses: actions/deploy-pages@v5

  # Con AWS_BUCKET definido, la página se publica en AWS en vez de GitHub Pages.
  publicar-aws:
    needs: revisar
    if: needs.revisar.outputs.publicar == 'si' && vars.AWS_BUCKET != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ARCHIVOS_ARMADOS: si
          NEXT_PUBLIC_PEDIDOS_URL: ${{ vars.TIENDA_ABIERTA == 'si' && vars.PEDIDOS_URL || '' }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROL }}
          aws-region: us-east-1
      - name: Subir la página
        run: |
          aws s3 sync out/_next/static "s3://$BUCKET/_next/static" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync out "s3://$BUCKET" --delete --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"
        env:
          BUCKET: ${{ vars.AWS_BUCKET }}
      - name: Refrescar CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUCION" --paths "/*"
        env:
          DISTRIBUCION: ${{ vars.AWS_DISTRIBUCION }}
