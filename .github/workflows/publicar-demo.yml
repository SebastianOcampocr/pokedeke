# Publica pokedeke.store (Cloudflare Pages) con cada cambio en main y cada vez
# que el catálogo de la hoja de Google cambia. La dirección vieja de GitHub Pages
# solo redirige: ver redirigir-github-pages.yml.
name: Publicar demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      permitir:
        description: "Permitir un cambio grande del catálogo (saltarse el freno)"
        type: boolean
        default: false
  schedule:
    # Lejos de la hora en punto, cuando GitHub tiene más carga.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publicar: ${{ steps.cambios.outputs.publicar }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Probar el servidor de la hoja y el catálogo
        run: npm test
      - name: Traer el catálogo de la hoja
        run: node scripts/traer-catalogo.mjs
        env:
          PEDIDOS_URL: ${{ vars.PEDIDOS_URL }}
          PERMITIR_CAMBIO_GRANDE: ${{ inputs.permitir && 'si' || 'no' }}
      - name: Traer las opiniones publicadas
        run: node scripts/traer-extras.mjs --solo opiniones
        env:
          PEDIDOS_URL: ${{ vars.PEDIDOS_URL }}
      - name: Guardar el catálogo si cambió
        id: cambios
        run: |
          if git diff --quiet datos/catalogo.json datos/opiniones.json datos/enlaces-viejos.json; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "publicar=no" >> "$GITHUB_OUTPUT"
            else
              echo "publicar=si" >> "$GITHUB_OUTPUT"
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos/catalogo.json datos/opiniones.json datos/enlaces-viejos.json
            git commit -m "Actualizar catálogo desde la hoja"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "publicar=si" >> "$GITHUB_OUTPUT"
          fi

  # Con AWS_BUCKET definido, la página se publica en AWS en vez de GitHub Pages.
  publicar-aws:
    needs: revisar
    if: needs.revisar.outputs.publicar == 'si' && vars.AWS_BUCKET != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Traer lo más visto
        run: node scripts/traer-extras.mjs --solo vistos
        env:
          PEDIDOS_URL: ${{ vars.PEDIDOS_URL }}
      - run: npm run build
        env:
          ARCHIVOS_ARMADOS: si
          NEXT_PUBLIC_PEDIDOS_URL: ${{ vars.PEDIDOS_URL }}
          NEXT_PUBLIC_TIENDA_ABIERTA: ${{ vars.TIENDA_ABIERTA }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_CLAVE_ID }}
          aws-secret-access-key: ${{ secrets.AWS_CLAVE_SECRETA }}
          aws-region: us-east-2
      - name: Subir la página
        run: |
          aws s3 sync out/_next/static "s3://$BUCKET/_next/static" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync out "s3://$BUCKET" --delete --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"
        env:
          BUCKET: ${{ vars.AWS_BUCKET }}
      - name: Refrescar CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUCION" --paths "/*"
        env:
          DISTRIBUCION: ${{ vars.AWS_DISTRIBUCION }}

  # Mientras AWS no verifique la cuenta, el dominio propio va en Cloudflare Pages.
  # Se enciende con la variable CLOUDFLARE_CUENTA (el Account ID) y el secreto
  # CLOUDFLARE_TOKEN (permiso "Cloudflare Pages: Edit").
  publicar-cloudflare:
    needs: revisar
    if: needs.revisar.outputs.publicar == 'si' && vars.CLOUDFLARE_CUENTA != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Traer lo más visto
        run: node scripts/traer-extras.mjs --solo vistos
        env:
          PEDIDOS_URL: ${{ vars.PEDIDOS_URL }}
      - run: npm run build
        env:
          ARCHIVOS_ARMADOS: si
          NEXT_PUBLIC_PEDIDOS_URL: ${{ vars.PEDIDOS_URL }}
          NEXT_PUBLIC_TIENDA_ABIERTA: ${{ vars.TIENDA_ABIERTA }}
      # Se corre dentro de out: en la raíz, wrangler detecta Next.js e intenta
      # convertir el proyecto en un Worker. El proyecto ya existe como Pages clásico.
      - name: Subir la página a Cloudflare
        working-directory: out
        run: npx --yes wrangler@4.152.0 pages deploy . --project-name=pokedeke --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_CUENTA }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
